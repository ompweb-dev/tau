name: Verify PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_VERSION: 1.5.2

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      # tau runs on Bun (its bins, the server, the host daemon and the tests); npm only installs the dependencies.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: npm ci

      # What publish.yml runs before npm publish: the tray must build from these sources and carry this commit.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: runner.os == 'Linux'
        with:
          dotnet-version: 8.0.x
      - name: Build the Windows tray (Linux only)
        if: runner.os == 'Linux'
        run: sh scripts/build-tray.sh

      # The pi tau drives (`pi --mode rpc`), on PATH for the tests' live sessions, the smoke tests and preflight.
      - name: Install pi
        run: npm install --global "@earendil-works/pi-coding-agent@$PI_VERSION"

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      # Hosted Linux runs in a service cgroup. Permit this runner to create scopes, not control services.
      - name: Allow isolated native fixture scopes (Linux only)
        if: runner.os == 'Linux'
        run: |
          rule="polkit.addRule(function(action, subject) { if (action.id === 'org.freedesktop.systemd1.manage-units' && subject.user === '$(id -un)' && /\\.scope$/.test(action.lookup('unit') || '')) { return polkit.Result.YES; } });"
          printf '%s\n' "$rule" | sudo tee /etc/polkit-1/rules.d/49-tau-fixture-scopes.rules >/dev/null
          systemd-run --scope --quiet --collect --no-ask-password true

      # Do not pass pwsh's Core module search path to Windows PowerShell children used by the native tests.
      - name: Select Windows PowerShell modules (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          "PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run unit & integration test suite
        # Native Windows fixtures spawn PowerShell/CIM children in addition to Bun's workers.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            npm test -- --parallel=2
          else
            npm test
          fi

      - name: Verify production build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      # The release binary for this runner (the -baseline x64 build releases ship), from the client built above, with its
      # own `tau host` daemon (scripts/build-binary.ts).
      - name: Binary smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            bun scripts/build-binary.ts --target bun-windows-x64-baseline
            bin=release/tau-windows-x64/tau.exe
            archive=release/tau-windows-x64.zip
          elif [ "$RUNNER_OS" = macOS ]; then
            arch=$(bun -p process.arch)
            target="bun-darwin-$arch"
            if [ "$arch" = x64 ]; then target="$target-baseline"; fi
            bun scripts/build-binary.ts --target "$target"
            bin="release/tau-darwin-$arch/tau"
            archive="release/tau-darwin-$arch.tar.gz"
          else
            bun scripts/build-binary.ts --target bun-linux-x64-baseline
            bin=release/tau-linux-x64/tau
            archive=release/tau-linux-x64.tar.gz
          fi
          # The archive a host downloads must pass the updater's own size limits and checks.
          bun scripts/check-host-release-archive.ts "$archive"
          npm run smoke -- --binary "$bin"
          # What the host updater checks on a new release before it switches (lib/hosts/update-worker.ts): the marker
          # it finds the command by, then the command itself against the pi on PATH.
          grep -qa tau-preflight-scratch- "$bin"
          "$bin" preflight

      # Required on every supported runner, including macOS foreground. A skip fails the job.
      - name: Native compiled coordinated upgrade and rollback
        shell: bash
        env:
          TAU_COMPILED_UPGRADE_E2E: "1"
        run: bun test --parallel --timeout 900000 lib/compiled-upgrade.integration.test.mjs

      - name: Packed install smoke test
        shell: bash
        run: |
          npm pack --ignore-scripts
          npm install -g --prefix "$RUNNER_TEMP/tau-prefix" ./ompweb-dev-tau-*.tgz
          npm run smoke -- --package "$(npm root -g --prefix "$RUNNER_TEMP/tau-prefix")/@ompweb-dev/tau"

      - name: Parse Windows PowerShell scripts (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'scripts/windows/tau-service.ps1', 'scripts/windows/tau-tray.ps1') {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$e) | Out-Null
            if ($e) { $e; exit 1 }
          }

      - name: Verify Windows System Tray & Shortcuts (Windows only)
        if: runner.os == 'Windows'
        run: |
          bun bin/tau-tray.js --status
          bun bin/tau-tray.js --install
          bun bin/tau-tray.js --status
          bun bin/tau-tray.js --uninstall

  pr-rules:
    name: PR Rules & Quality Gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify no forbidden secret or temporary files committed
        run: |
          FORBIDDEN_FILES=$(git diff --name-only origin/main...HEAD | grep -E '(\.env(\..+)?|\.pem|\.key|\.pfx|\.p12|\.DS_Store|thumbs\.db)$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Forbidden secret or OS temporary files detected in commit:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi

      - name: Validate PR Title convention
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+'; then
            echo "::warning::PR title does not match Conventional Commits format (e.g. feat(scope): description): $PR_TITLE"
          fi
