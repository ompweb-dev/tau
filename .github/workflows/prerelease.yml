name: Binary prerelease

# Every commit on main that passed Verify PR becomes a GitHub prerelease carrying the five single binaries,
# titled with the time it was created (2026-11-01T10:30:00Z), tag 20261101T103000Z-<short sha> (git tags
# cannot hold ":"; the sha keeps parallel runs apart). Prereleases are never "latest", so the in-app update
# notice and `v*` releases are unaffected.
on:
  workflow_run:
    workflows: [Verify PR]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One group per commit: a shared group keeps only one pending run, so a burst of merges would drop commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prerelease:
    # A manual run publishes main only: from another branch it would ship that branch's unverified code.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PI_VERSION: 1.5.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SHA }}
          # npm ci runs dependency install scripts: keep the write token out of .git/config (gh reads GH_TOKEN).
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      # tau runs on Bun (its bins, the server, the host daemon and the tests); npm only installs the dependencies.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: npm ci
      - run: npm run build
      - name: Install pi
        run: npm install --global "@earendil-works/pi-coding-agent@$PI_VERSION"
      - name: Pin the binary release identity
        run: |
          now=$(date -u +%s)
          echo "RELEASE_TITLE=$(date -u -d "@$now" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$(date -u -d "@$now" +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=10 "$SHA")" >> "$GITHUB_ENV"
      - name: Build the release binaries
        env:
          TAU_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: sh scripts/build-release-binaries.sh
      # Hosted Linux runs in a service cgroup: the server starts the local host in its own systemd scope.
      - name: Allow isolated native fixture scopes
        run: |
          rule="polkit.addRule(function(action, subject) { if (action.id === 'org.freedesktop.systemd1.manage-units' && subject.user === '$(id -un)' && /\\.scope$/.test(action.lookup('unit') || '')) { return polkit.Result.YES; } });"
          printf '%s\n' "$rule" | sudo tee /etc/polkit-1/rules.d/49-tau-fixture-scopes.rules >/dev/null
          systemd-run --scope --quiet --collect --no-ask-password true
      - run: npm run smoke -- --binary release/tau-linux-x64/tau

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$RELEASE_TITLE"
          tag="$RELEASE_TAG"
          subject=$(git log -1 --format=%s "$SHA")
          # A draft first, so a failed upload never leaves a published prerelease missing archives.
          gh release create "$tag" release/tau-*.tar.gz release/tau-*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft --prerelease --title "$title" \
            --notes "Binaries built from $GITHUB_REPOSITORY@$SHA ($subject), tested with pi $PI_VERSION. Not a release: no npm package, no update notice."
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
